name: Monthly update

# Checks Google Scholar and conf.researchr.org on the last day of each month,
# imports what is new, rebuilds the site and CVs, and pushes the result.
# Items already recorded in resources/sync-state.json are never looked at again.

on:
  schedule:
    # Cron has no "last day of month": run on days 28-31 and let the first step decide.
    - cron: "0 6 28-31 * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the site and CVs even if nothing new was found"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

env:
  PANDOC_VERSION: "3.8.3"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Continue only on the last day of the month
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u -d tomorrow +%d)" != "01" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the last day of the month: nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Check Google Scholar and conf.researchr.org
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install -q -r requirements.txt
          python build/sync-updates.py --report "$RUNNER_TEMP/sync-report.md"

      - name: See what changed
        if: steps.gate.outputs.run == 'true'
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- sources resources/publications.bib)" ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Pandoc, XeLaTeX and fonts
        if: steps.changes.outputs.build == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            lmodern ttf-mscorefonts-installer
          sudo fc-cache -f

      - name: Rebuild the site and CVs
        if: steps.changes.outputs.build == 'true'
        # The check above already ran; run.sh would only repeat it.
        run: SKIP_SYNC=1 VERBOSE=1 bash run.sh

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Monthly update $(date -u +%Y-%m)"
            echo
            cat "$RUNNER_TEMP/sync-report.md"
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -q -F "$RUNNER_TEMP/commit-message.txt"
          git push
